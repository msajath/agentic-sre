apiVersion: v1
kind: Namespace
metadata:
  name: agentic-sre
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-config
  namespace: agentic-sre
data:
  APP_NAME: "Agentic SRE Platform"
  ENVIRONMENT: "production"
  SRE_DEBUG: "false"
  SIMULATION_ENABLED: "true"
  ALLOWED_ORIGINS: '["https://sre.example.com"]'
  OLLAMA_BASE_URL: "https://ollama.example.internal"
  PORT: "8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-sre-deployment
  namespace: agentic-sre
  labels:
    app: agentic-sre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-sre
  template:
    metadata:
      labels:
        app: agentic-sre
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: prisma-migrate
          image: agentic-sre-database:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-secrets
                  key: database-url
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: agentic-sre
          image: agentic-sre:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sre-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-secrets
                  key: secret-key
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sre-secrets
                  key: bootstrap-admin-password
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-sre-service
  namespace: agentic-sre
spec:
  type: ClusterIP
  selector:
    app: agentic-sre
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: app-port
      port: 8000
      targetPort: 8000
