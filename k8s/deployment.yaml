apiVersion: v1
kind: Namespace
metadata:
  name: agentic-sre
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-config
  namespace: agentic-sre
data:
  APP_NAME: "Agentic SRE Platform"
  ENVIRONMENT: "production"
  PORT: "8000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sre-data-pvc
  namespace: agentic-sre
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-sre-deployment
  namespace: agentic-sre
  labels:
    app: agentic-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-sre
  template:
    metadata:
      labels:
        app: agentic-sre
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: agentic-sre
          image: agentic-sre:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sre-config
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: sre-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-sre-service
  namespace: agentic-sre
spec:
  type: ClusterIP
  selector:
    app: agentic-sre
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: app-port
      port: 8000
      targetPort: 8000
