services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentic_sre
      POSTGRES_DB: agentic_sre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_sre -d agentic_sre"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: agentic-sre-database:0.1.0
    build:
      context: .
      target: database
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL to the postgres service URL}
    depends_on:
      postgres:
        condition: service_healthy
  agentic-sre:
    image: agentic-sre:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-sre-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Agentic SRE Platform
      ENVIRONMENT: production
      SRE_DEBUG: "false"
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL to the postgres service URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8000"]}'
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      HOST: 0.0.0.0
      PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
    driver: local
