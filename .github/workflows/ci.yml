name: CI/CD Pipeline - Agentic SRE Platform

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Check Python and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Security Audit (Bandit)
        run: |
          bandit -r src/ -ll -ii

      - name: Audit Python runtime dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

      - name: Check Python Imports and Undefined Names
        run: python -m flake8 src scripts tests --select=F

      - name: Check Deployment Shell Scripts
        run: bash -n deploy/backup.sh deploy/deploy.sh

  postgres-checks:
    name: Test Backend with PostgreSQL and Prisma
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sre_ci
          POSTGRES_PASSWORD: isolated-ci-database-password
          POSTGRES_DB: agentic_sre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_ci -d agentic_sre_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sre_ci:isolated-ci-database-password@127.0.0.1:5432/agentic_sre_test
      TEST_DATABASE_URL: postgresql://sre_ci:isolated-ci-database-password@127.0.0.1:5432/agentic_sre_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:typecheck
      - run: npm run db:migrate
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run db:check
      - run: python scripts/test_postgres.py

  frontend-checks:
    name: Validate Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint -- --deny-warnings
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: [lint-and-security, postgres-checks, frontend-checks]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: agentic-sre:0.1.0

      - name: Build Prisma Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: database
          push: false
          load: true
          tags: agentic-sre-database:0.1.0

      - name: Scan application image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-sre:0.1.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan migration image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-sre-database:0.1.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke Test PostgreSQL Stack
        shell: bash
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          export BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export DOCKER_DATABASE_URL="postgresql://agentic_sre:${POSTGRES_PASSWORD}@postgres:5432/agentic_sre"
          export SRE_IMAGE_BASE=agentic-sre
          export SRE_IMAGE_TAG=0.1.0
          docker compose -f docker-compose.yml config --quiet
          docker compose --project-name agentic-sre -f deploy/compose.vps.yml config --quiet
          trap 'docker compose --project-name agentic-sre -f deploy/compose.vps.yml logs; docker compose --project-name agentic-sre -f deploy/compose.vps.yml down -v' EXIT
          docker compose --project-name agentic-sre -f deploy/compose.vps.yml up -d --no-build
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/readyz
          curl --fail --silent http://localhost:8000/ | grep -q '<html'
          curl --fail --silent http://localhost:8000/login | grep -q '<html'
          curl --fail --silent http://localhost:8000/signup | grep -q '<html'
          python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"username": "admin", "password": os.environ["BOOTSTRAP_ADMIN_PASSWORD"]}).encode()
          request = urllib.request.Request("http://localhost:8000/api/v1/auth/login", data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request) as response:
              assert json.load(response)["access_token"]
          PY
          touch "$RUNNER_TEMP/agentic-sre.env"
          chmod 600 "$RUNNER_TEMP/agentic-sre.env"
          SRE_SKIP_PULL=true SRE_ENV_FILE="$RUNNER_TEMP/agentic-sre.env" SRE_BACKUP_DIR="$RUNNER_TEMP/agentic-sre-backups" bash deploy/deploy.sh

  publish-images:
    name: Publish versioned images to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image names
        shell: bash
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API and dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ github.ref_name }}
      - name: Publish Prisma migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: database
          push: true
          tags: ${{ env.IMAGE_BASE }}-database:${{ github.ref_name }}
